<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站导航页</title>
    <style>
        /* 1. 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f0f2f5; /* 浅灰背景 */
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* 2. 主容器 */
        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        /* 3. 头部标题 */
        header {
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* 4. 导航网格布局 (响应式) */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* 5. 卡片样式 */
        .nav-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px 30px;
            text-decoration: none; /* 去除下划线 */
            color: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease; /* 动画过渡 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #e1e4e8;
            position: relative;
        }

        /* 鼠标悬停时的效果 */
        .nav-card:hover {
            transform: translateY(-10px); /* 向上浮动 */
            box-shadow: 0 14px 28px rgba(0,0,0,0.1); /* 阴影加深 */
            border-color: #409EFF; /* 边框变色 */
        }

        /* Gitee 图标样式 */
        .gitee-icon {
            position: absolute;
            bottom: 10px;
            right: 10px;

            /* 1. 强制限制图片大小 */
            width: 24px;
            height: 24px;

            /* 2. 将黑色图标变为 Gitee 红色 (#C71D23) */
            /* 原理：先变灰，再改变色相，最后调整饱和度 */
            filter: brightness(0) saturate(100%) invert(14%) sepia(93%) saturate(6428%) hue-rotate(350deg) brightness(96%) contrast(106%);

            transition: transform 0.3s, filter 0.3s;
            pointer-events: auto;
            cursor: pointer;
        }

        .gitee-icon:hover {
            transform: scale(1.2); /* 悬停放大一点 */
        }

        /* 6. 图标与文字 */
        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #303133;
        }

        .nav-desc {
            font-size: 0.9rem;
            color: #909399;
            line-height: 1.5;
        }

        /* 7. 底部 */
        footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <header>
        <h1>👋 欢迎来到我的主页</h1>
        <p>个人开发的系统和用于修复公司问题的小工具</p>
    </header>

    <!-- 导航区域 -->
    <div class="nav-grid">

        <a href="huichuang.html" target="_blank" class="nav-card">
            <span class="icon">📧</span>
            <div class="nav-title">py系统预览</div>
            <div class="nav-desc">个人开发的py版快速开发框架</div>
            <span class="gitee-icon" title="前往Gitee" onclick="window.open('https://gitee.com/lin-chuanghui/huichuang-py', '_blank')">
                <img src="imgs/gitee.svg" alt="Gitee" class="gitee-icon" />
            </span>
        </a>

        <a href="erp.html" target="_blank" class="nav-card">
            <span class="icon">🌐</span>
            <div class="nav-title">erp系统预览</div>
            <div class="nav-desc">芋道开源搭建修改后的erp</div>
        </a>

        <a href="mp.html" target="_blank" class="nav-card">
            <span class="icon">🌐</span>
            <div class="nav-title">公众号系统预览</div>
            <div class="nav-desc">芋道开源搭建修改后的公众号管理</div>
        </a>

        <a href="py.html" target="_blank" class="nav-card">
            <span class="icon">📧</span>
            <div class="nav-title">py工具预览</div>
            <div class="nav-desc">修复公司系统数据的小工具</div>
        </a>
        <a href="tt.html" target="_blank" class="nav-card">
            <span class="icon">📧</span>
            <div class="nav-title">科传系统预览</div>
            <div class="nav-desc">科传零售地产管理系统预览</div>
        </a>
        <a href="gw.html" target="_blank" class="nav-card">
            <span class="icon">📧</span>
            <div class="nav-title">公司官网</div>
            <div class="nav-desc">根据UI帮公司开发的官网</div>
        </a>
        <!-- 链接 4：跳转到 外部网站 (示例) -->
        <!-- target="_blank" 表示在新窗口打开 -->
       <!-- <a href="https://www.example.com" target="_blank" class="nav-card">
            <span class="icon">🌐</span>
            <div class="nav-title">外部链接</div>
            <div class="nav-desc">这是一个跳转到新标签页的外部网站示例。</div>
        </a>-->

    </div>

    <!-- 底部 -->
    <footer>
        &copy; 2024 我的个人网站. All rights reserved.
    </footer>
</div>
<script>
    // 获取所有带有 gitee-icon 类的元素
    const giteeIcons = document.querySelectorAll('.gitee-icon');

    giteeIcons.forEach(icon => {
        icon.addEventListener('click', function(e) {
            e.preventDefault(); // 防止默认行为
            e.stopPropagation(); // 阻止事件冒泡，防止触发父级 a 标签的跳转
            window.open(this.getAttribute('data-url'), '_blank'); // 打开新窗口
        });
    });
</script>
</body>
</html>
