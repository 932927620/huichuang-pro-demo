<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统预览</title>
  <link rel="stylesheet" href="css/preview.css" />
</head>
<body>

  <div class="container">
    <!-- 左侧菜单 -->
    <div class="sidebar">
<!--      <img src="imgs/logo2.png" alt="Logo" />-->
      <div class="system-preview">erp系统</div>
      <!-- 首页：standalone，无子菜单 -->
      <div class="submenu-item standalone active" data-image="imgs/erp/home.png">首页</div>

      <!-- 系统管理 -->
      <div class="parent-menu" data-parent="menu1">
        <span>系统管理</span>
        <span class="arrow">▶</span>
      </div>
      <div class="submenu" id="menu1">
        <div class="submenu-item" data-image="imgs/xt-user.png">用户管理</div>
        <div class="submenu-item" data-image="imgs/xt-jsgl.png">角色管理</div>
        <div class="submenu-item" data-image="imgs/xt-cdgl.png">菜单管理</div>
        <div class="submenu-item" data-image="imgs/xt-bmgl.png">部门管理</div>
        <div class="submenu-item" data-image="imgs/xt-gwgl.png">岗位管理</div>
        <div class="submenu-item" data-image="imgs/xt-tzgg.png">通知公告</div>
      </div>

      <!-- 基础设施 -->
      <div class="parent-menu" data-parent="menu2">
        <span>基础设施</span>
        <span class="arrow">▶</span>
      </div>
      <div class="submenu" id="menu2">
        <div class="submenu-item" data-image="imgs/pz-wjpz.png">文件配置</div>
        <div class="submenu-item" data-image="imgs/pz-wjlb.png">文件列表</div>
        <div class="submenu-item" data-image="imgs/pz-pzgl.png">配置管理</div>
      </div>

      <!-- ERP系统 -->
      <div class="parent-menu" data-parent="menu3">
        <span>ERP系统</span>
        <span class="arrow">▶</span>
      </div>
      <div class="submenu" id="menu3">
        <div class="submenu-item" data-image="imgs/erp/erp-erphome.png">ERP首页</div>
        <div class="parent-menu" data-parent="menu3-cg">
          <span>采购管理</span>
          <span class="arrow">▶</span>
        </div>
        <div class="submenu" id="menu3-cg">
          <div class="submenu-item" data-image="imgs/erp/erp-cgdd.png">采购订单</div>
          <div class="submenu-item" data-image="imgs/erp/erp-cgrk.png">采购入库</div>
          <div class="submenu-item" data-image="imgs/erp/erp-cgth.png">采购退货</div>
          <div class="submenu-item" data-image="imgs/erp/erp-gysxx.png">供应商信息</div>
        </div>
        <div class="parent-menu" data-parent="menu3-kc">
          <span>库存管理</span>
          <span class="arrow">▶</span>
        </div>
        <div class="submenu" id="menu3-kc">
          <div class="submenu-item" data-image="imgs/erp/erp-ckxx.png">仓库信息</div>
          <div class="submenu-item" data-image="imgs/erp/erp-cpkc.png">产品库存</div>
          <div class="submenu-item" data-image="imgs/erp/erp-crkmx.png">出入库明细</div>
          <div class="submenu-item" data-image="imgs/erp/erp-qtrk.png">其他入库</div>
          <div class="submenu-item" data-image="imgs/erp/erp-qtck.png">其他出库</div>
          <div class="submenu-item" data-image="imgs/erp/erp-kcdb.png">库存调拨</div>
          <div class="submenu-item" data-image="imgs/erp/erp-kcpd.png">库存盘点</div>
        </div>
        <div class="parent-menu" data-parent="menu3-xs">
          <span>销售管理</span>
          <span class="arrow">▶</span>
        </div>
        <div class="submenu" id="menu3-xs">
          <div class="submenu-item" data-image="imgs/erp/erp-xsdd.png">销售订单</div>
          <div class="submenu-item" data-image="imgs/erp/erp-xsck.png">销售出库</div>
          <div class="submenu-item" data-image="imgs/erp/erp-xsth.png">销售退货</div>
          <div class="submenu-item" data-image="imgs/erp/erp-khxx.png">客户信息</div>
        </div>
        <div class="parent-menu" data-parent="menu3-cp">
          <span>产品管理</span>
          <span class="arrow">▶</span>
        </div>
        <div class="submenu" id="menu3-cp">
          <div class="submenu-item" data-image="imgs/erp/erp-cpxx.png">产品信息</div>
          <div class="submenu-item" data-image="imgs/erp/erp-cpfl.png">产品分类</div>
          <div class="submenu-item" data-image="imgs/erp/erp-cpdw.png">产品单位</div>
        </div>
        <div class="parent-menu" data-parent="menu3-cw">
          <span>财务管理</span>
          <span class="arrow">▶</span>
        </div>
        <div class="submenu" id="menu3-cw">
          <div class="submenu-item" data-image="imgs/erp/erp-fkd.png">付款单</div>
          <div class="submenu-item" data-image="imgs/erp/erp-skd.png">收款单</div>
          <div class="submenu-item" data-image="imgs/erp/erp-jszh.png">结算账户</div>
        </div>
      </div>
    </div>

    <!-- 右侧图片区域 -->
    <div class="content">
      <div class="image-container">
        <img id="mainImage" src="imgs/erp/home.png" alt="首页" />
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const mainImage = document.getElementById('mainImage');
      const sidebar = document.querySelector('.sidebar');

      const topLevelParents = Array.from(sidebar.children).filter(el =>
              el.classList.contains('parent-menu')
      );

      sidebar.addEventListener('click', function (e) {
        const target = e.target;

        if (target.classList.contains('parent-menu')) {
          e.stopPropagation();

          const targetId = target.getAttribute('data-parent');
          const submenu = document.getElementById(targetId);
          if (!submenu) return;

          const isCurrentlyOpen = submenu.classList.contains('show');

          // 🔸 局部手风琴：关闭同级嵌套菜单
          const directParentSubmenu = target.closest('.submenu');
          if (directParentSubmenu) {
            directParentSubmenu.querySelectorAll('.parent-menu').forEach(sib => {
              if (sib === target) return;
              const sibId = sib.getAttribute('data-parent');
              const sibSub = document.getElementById(sibId);
              if (sibSub) {
                sibSub.classList.remove('show');
                sib.classList.remove('active');
              }
            });
          }

          // 🔸 全局手风琴：关闭其他顶级菜单
          if (topLevelParents.includes(target)) {
            topLevelParents.forEach(parent => {
              if (parent === target) return;
              const id = parent.getAttribute('data-parent');
              const sub = document.getElementById(id);
              if (sub) {
                sub.classList.remove('show');
                parent.classList.remove('active');
              }
            });
          }

          // 切换当前
          if (isCurrentlyOpen) {
            submenu.classList.remove('show');
            target.classList.remove('active');
          } else {
            submenu.classList.add('show');
            target.classList.add('active');
          }
        }

        // 叶子节点点击（图片切换）
        if (target.classList.contains('submenu-item') && !target.classList.contains('parent-menu')) {
          document.querySelectorAll('.submenu-item.active').forEach(el => {
            el.classList.remove('active');
          });
          target.classList.add('active');

          const imageUrl = target.getAttribute('data-image');
          if (imageUrl) {
            mainImage.src = imageUrl;
            mainImage.alt = target.textContent.trim();
          }
        }

      });
    });
  </script>
</body>
</html>
